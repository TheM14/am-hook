# 构建 Windows x64 的免安装 exe 与 NSIS 安装包。
# 推送 v* 标签时再创建一个草稿 release，把这两个文件挂上去；
# 其他分支和 PR 只跑测试和构建，产物留在 Actions 的 artifact 里。
name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build executable and installer
        run: npm run tauri build -- --bundles nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: am-hook-gui-windows-x64
          path: |
            src-tauri/target/release/am-hook-gui.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: am-hook-gui-windows-x64
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: am-hook GUI ${{ github.ref_name }}
          files: |
            release/am-hook-gui.exe
            release/bundle/nsis/*.exe
          generate_release_notes: true
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
